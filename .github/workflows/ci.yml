name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test
        run: ./scripts/test.sh
      - name: Verify Maven project model
        if: matrix.java == '17'
        run: mvn --batch-mode verify
      - name: Check packaged simulations
        run: |
          java -Djava.awt.headless=true -jar build/ia-arcade.jar --headless --game breakout --steps 1000
          java -Djava.awt.headless=true -jar build/ia-arcade.jar --headless --game pacman --steps 1000
      - uses: actions/upload-artifact@v4
        with:
          name: ia-arcade-java-${{ matrix.java }}
          path: build/ia-arcade.jar

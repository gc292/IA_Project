name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./scripts/test.sh
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - name: Verify Maven project model
        if: runner.os == 'Linux' && matrix.java == '17'
        run: mvn --batch-mode verify
      - name: Check packaged simulations
        shell: bash
        run: |
          java -Djava.awt.headless=true -jar build/ia-arcade.jar --headless --game breakout --steps 1000
          java -Djava.awt.headless=true -jar build/ia-arcade.jar --headless --game pacman --steps 1000
      - uses: actions/upload-artifact@v4
        with:
          name: ia-arcade-${{ matrix.os }}-java-${{ matrix.java }}
          path: build/ia-arcade.jar
